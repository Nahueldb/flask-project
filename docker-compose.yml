volumes:
  db_data:

services:
  app:
    build: .
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"
    command: gunicorn --bind 0.0.0.0:5000 run:app
    volumes:
      - ./:/app
    ports:
      - 5000:5000
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data